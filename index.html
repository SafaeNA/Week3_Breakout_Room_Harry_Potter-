<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Movie Website</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>

        <!--Header and Navigation Bar-->

        <div class=“logo”>
            <h1>Harry Potter</h1>
        </div>

        <nav aria-label=“Main navigation”>
            <ul>
                <li><a href="Home">Home</a></li>
                <li><a href="About">About</a></li>
                <li><a href="Cast">Cast</a></li>
                <li><a href="Trailer">Trailer</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <!-- Hero Section -->

        <section id=“home” class=“hero”>
            <img src=“images/hero.jpg” alt=“Hogwarts castle at night”>
        </section>

        <!-- About the Series -->
        <section id=“about” class=“about”>
            <h2>About the Series</h2>

            <p>
                Follow Harry Potter as he discovers the
                magical world of Hogwarts, makes lifelong
                friendships, and faces powerful challenges.
            </p>

        </section>

        <!-- Character Section -->
        <section id=“cast” class=“cast”>
            <h2>Meet the Characters</h2>

            <div class=“cast-grid”></div>

            <article class=“character-card”>
                <img src=“images/harry.jpg” alt=“Harry Potter”>
                <h3>Harry Potter</h3>
            </article>

            <article class=“character-card”>
                <img src=“images/hermione.jpg” alt=“Hermione Granger”>
                <h3>Hermione Granger</h3>
            </article>

            <article class=“character-card”>
                <img src=“images/ron.jpg” alt=“Ron Weasley”>
                <h3>Ron Weasley</h3>
            </article>

            </div>
        </section>

        <!-- Trailer Section -->
        <section id=“trailer” class=“trailer”>
            <h2>WatchTrailer</h2>










    </main>

    <footer>
    </footer>

</body>

</html>
