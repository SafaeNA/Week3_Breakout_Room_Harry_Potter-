<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Movie Website</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="header">

        <!--Header and Navigation Bar-->

        <div class=“logo”>
            <h1>Harry Potter</h1>
        </div>

        <nav aria-label=“Main navigation” class="navigation">
            <ul>
                <li><a href="#Home">Home</a></li>
                <li><a href="#About">About</a></li>
                <li><a href="#Cast">Cast</a></li>
                <li><a href="#Trailer">Trailer</a></li>
            </ul>
        </nav>

    </header>

    <main class="main">

        <!-- Hero Section -->

        <section id="Home" class=“hero”>
            <img src="Hogwarts.jpeg" alt="Hogwarts Castle" class="hogwarts">
        </section> <br>

        <!-- About the Series -->
        <section id="About" class=“about”>
            <h2 style="text-align: center;">About the Series</h2>

            <p>
                Follow Harry Potter as he discovers the
                magical world of Hogwarts, makes lifelong
                friendships, and faces powerful challenges.
            </p>

        </section> <br>
       <!-- Character Section -->
      <br> 
        <section id="Cast" class="cast">
            <h2>Meet the Characters</h2>

    <div class="character-container">
        <article class="character-card">
            <img src="Daniel.jpeg" alt="Daniel Radcliffe">
            <h3>Daniel Radcliffe</h3>
        </article>

        <article class="character-card">
            <img src="Emma.jpeg" alt="Hermione Granger">
            <h3>Hermione Granger</h3>
        </article>

        <article class="character-card">
            <img src="Ron.jpeg" alt="Ron Weasley">
            <h3>Ron Weasley</h3>
        </article>
    </div>
</section>


        <!-- Trailer Section -->
        <section id="Trailer" class="trailer">
            <h2>WatchTrailer</h2>
           <iframe 
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/VyHV0BRtdxo" 
                title="Harry Potter and the Sorcerer's Stone (2001) Official Trailer" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
            
        </section>


    </main>

    <footer>
    </footer>

</body>

</html>
